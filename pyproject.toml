[project]
name = "openapi"
version = "0.4.0"
description = "OpenAPI Spec Loader connector"
requires-python = ">=3.11"
dependencies = [
    "atlan-application-sdk>=3.6.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "atlan-application-sdk[tests]>=3.6.0,<4.0.0",
    "pytest-asyncio>=1.3.0,<2",
    "respx>=0.22.0,<1",
    "pre-commit>=4.2.0,<5",
    "coverage[toml]>=7.13.5,<8",
    "scalene>=2.2.1,<3",
    "poethepoet>=0.34.0",
    "atlan-application-sdk-conformance<=1.0.0",
]
mutation = [
    "mutmut>=3.6.0,<4.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    # pyatlan and pyatlan_v9 both read their version via the deprecated
    # importlib.resources read_text/open_text API — not fixable from our side
    "ignore:read_text is deprecated:DeprecationWarning",
    "ignore:open_text is deprecated:DeprecationWarning",
    # httpx internal deprecation — not triggered by our code, not fixable here
    "ignore:Use 'content=<\\.\\.\\.>' to upload raw bytes:DeprecationWarning",
]
markers = [
    "cloud_integration: requires a running S3-compatible emulator (MinIO)",
    "azure_integration: requires a running Azure blob storage emulator (Azurite)",
    "e2e: tenant-hitting end-to-end test (requires ATLAN_BASE_URL + ATLAN_API_KEY)",
]
addopts = "-m 'not cloud_integration and not azure_integration'"

[tool.poe.tasks]
# No external deps needed: Dapr is mocked; Temporal runs embedded in-process via
# temporalio.testing.WorkflowEnvironment.start_local() (SDK embedded_runtime()).
download-components = "echo 'No Dapr components needed for OpenAPI connector'"
start-deps = "echo 'No external deps needed — Temporal runs embedded in pytest'"
stop-deps = "echo 'No external deps to stop'"

[tool.ruff.lint]
extend-select = ["G001", "G003", "G004", "T201", "LOG009"]

[tool.ruff.lint.per-file-ignores]
".github/**" = ["T201"]


# Mutation testing baseline (advisory measurement — see application-sdk PR #2642).
[tool.mutmut]
source_paths = ["app"]
# Generated from contract/app.pkl — regenerated on every contract change,
# mirrors the coverage omit; mutating it only produces noise.
do_not_mutate = ["app/generated/*"]
# Mutating __file__-based path derivation inside default arguments evaluates
# at import time and crashes collection; such mutants are noise anyway.
do_not_mutate_patterns = ['__file__']
# Collect the whole tests/ tree and clear addopts; the MUTATION_LANE env var
# (read by tests/conftest.py) narrows collection to the active lane's tests.
# One static config serves all three lanes — see docs/mutation-testing.md.
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-o", "addopts=", "-p", "no:cacheprovider"]
also_copy = [
    "contract/",
    "main.py",
    "app.yaml",
    "atlan.yaml",
    "contract_schema.lock.json",
]
