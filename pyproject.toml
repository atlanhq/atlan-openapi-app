[project]
name = "openapi"
version = "0.1.0"
description = "OpenAPI Spec Loader connector"
requires-python = ">=3.11"
dependencies = [
    "app-framework[atlan]",
    "atlan-loader",
    "PyYAML>=6.0",
]

[tool.uv.sources]
app-framework = { git = "https://github.com/atlanhq/experimental-app-sdk", subdirectory = "packages/app-framework" }
atlan-loader = { git = "https://github.com/atlanhq/experimental-app-sdk", subdirectory = "examples/atlan_loader" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
