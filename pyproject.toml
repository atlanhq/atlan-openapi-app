[project]
name = "openapi"
version = "0.3.0"
description = "OpenAPI Spec Loader connector"
requires-python = ">=3.11"
dependencies = [
    "atlan-application-sdk>=3.6.0,<4.0.0",
    "PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "atlan-application-sdk[tests,pandas]>=3.6.0,<4.0.0",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "respx>=0.22.0,<1",
    "httpx>=0.28.1,<1",
    "pre-commit>=4.2.0,<5",
    "coverage[toml]>=7.13.5,<8",
    "scalene>=2.2.1,<3",
    "poethepoet>=0.34.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    # pyatlan and pyatlan_v9 both read their version via the deprecated
    # importlib.resources read_text/open_text API — not fixable from our side
    "ignore:read_text is deprecated:DeprecationWarning",
    "ignore:open_text is deprecated:DeprecationWarning",
    # httpx internal deprecation — not triggered by our code, not fixable here
    "ignore:Use 'content=<\\.\\.\\.>' to upload raw bytes:DeprecationWarning",
]
markers = [
    "cloud_integration: requires a running S3-compatible emulator (MinIO)",
    "azure_integration: requires a running Azure blob storage emulator (Azurite)",
    "e2e: tenant-hitting end-to-end test (requires ATLAN_BASE_URL + ATLAN_API_KEY)",
]
addopts = "-m 'not cloud_integration and not azure_integration'"

[tool.poe.tasks]
# Integration tests use MockStateStore + MockSecretStore — Dapr is not needed.
download-components = "echo 'No Dapr components needed for OpenAPI connector'"
start-deps.shell = "temporal server start-dev --db-filename /tmp/temporal.db --headless & until temporal operator namespace describe default >/dev/null 2>&1; do sleep 1; done && echo 'Temporal is ready'"
stop-deps.shell = "lsof -ti:7233 | xargs kill -9 2>/dev/null || true"

