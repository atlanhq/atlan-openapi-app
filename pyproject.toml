[project]
name = "openapi"
version = "0.1.0"
description = "OpenAPI Spec Loader connector"
requires-python = ">=3.11"
dependencies = [
    "atlan-application-sdk[workflows]",
    "PyYAML>=6.0",
]

[tool.uv.sources]
atlan-application-sdk = { git = "https://github.com/atlanhq/application-sdk", branch = "gaurav/app-vitals" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "httpx>=0.28.1",
    "pre-commit>=4.2.0",
    "coverage[toml]>=7.13.5",
    "scalene>=2.2.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
