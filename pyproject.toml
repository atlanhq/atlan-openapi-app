[project]
name = "openapi"
version = "0.7.0"
description = "OpenAPI Spec Loader connector"
requires-python = ">=3.11"
dependencies = [
    # Floor is a security floor, above the preflight-gate floor it used to sit
    # at. Two constraints, the higher one wins:
    #
    #  - 3.24.1 — app/handler.py reads PreflightInput.timeout_seconds as the
    #    *enforced* remaining gate budget and sizes its probe to it; that
    #    contract, and the App-level budget knobs, land here. Older resolves
    #    silently give the handler an advisory number and no gate to run it.
    #  - 3.29.0 — ENABLE_LOG_DIAGNOSE lands, defaulting loguru's `diagnose` to
    #    False. Below this the SDK takes loguru's own default of True, and a
    #    traceback through a frame holding a resolved credential renders that
    #    credential's value onto the console. app/connector.py relies on the
    #    3.29.0 behaviour to chain its object-store credential failure
    #    (`from exc`) instead of severing it.
    "atlan-application-sdk>=3.29.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    # Floor is higher than the runtime dep above: the integration suite
    # imports application_sdk.testing.integration.fixtures, which first
    # ships in 3.31.0. Resolving 3.30.0 or older collects zero integration
    # tests with an ImportError, not a skip.
    "atlan-application-sdk[tests]>=3.31.0,<4.0.0",
    "pytest-asyncio>=1.3.0,<2",
    # Bounds a hung integration test (e.g. a wedged embedded-Temporal worker) so
    # it fails fast rather than eating the CI job's full timeout-minutes.
    "pytest-timeout>=2.3.0,<3",
    "respx>=0.22.0,<1",
    "pre-commit>=4.2.0,<5",
    "coverage[toml]>=7.13.5,<8",
    "scalene>=2.2.1,<3",
    "poethepoet>=0.34.0",
    "atlan-application-sdk-conformance<=1.0.0",
]

# Pin PyPI as uv's default index so the resolver does not inherit whatever
# default index the machine supplies (on an Atlan laptop, the Endor Labs
# package firewall in ~/.config/uv/uv.toml), which silently rewrites every
# package URL in uv.lock to a credentialed proxy CI holds no credential for.
# Declared here rather than in a project-level uv.toml: a uv.toml suppresses
# [tool.uv] in this file entirely. See conformance D012 / D013.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Keep tests and async fixtures on the SAME event loop. The session-scoped
# worker/client fixtures (tests/integration/conftest.py) live on the session
# loop; without pinning the test loop scope too it defaults to "function", so a
# test that drives a fixture-owned resource (the Temporal worker) from its own
# body submits work the session loop never polls and hangs until timeout. Both
# scopes must match. (SDK conformance rule T019 guards this.)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    # pyatlan and pyatlan_v9 both read their version via the deprecated
    # importlib.resources read_text/open_text API — not fixable from our side
    "ignore:read_text is deprecated:DeprecationWarning",
    "ignore:open_text is deprecated:DeprecationWarning",
    # httpx internal deprecation — not triggered by our code, not fixable here
    "ignore:Use 'content=<\\.\\.\\.>' to upload raw bytes:DeprecationWarning",
]
# Integration tests live under tests/integration/ and are run by the SDK's
# directory-scoped integration CI job (`pytest tests/integration/`), so we do
# NOT `addopts`-deselect them — a deselection would empty that job (collected 0
# → pytest exit 5). Emulator-dependent tests self-skip when their service is
# unreachable (see tests/integration/test_{s3,azure}_download.py), so a bare
# local `pytest` stays green without MinIO/Azurite. The `integration` marker is
# the fleet standard (matches atlan-mysql-app/atlan-metabase-app) and lets a dev
# opt out locally with `-m "not integration"`.
markers = [
    "integration: requires external services (MinIO/Azurite emulators); deselect locally with '-m \"not integration\"'",
    "e2e: tenant-hitting end-to-end test (requires ATLAN_BASE_URL + ATLAN_API_KEY)",
    # Registered here only so an ordinary `pytest` run does not warn on it. The
    # marker is consumed by conformance's own plugin, which `detect --with-tests`
    # loads (`-p conformance.preflight_testing`) and which registers it again in
    # that subprocess. Under a plain run these tests are just unit tests.
    "preflight_conformance(rule, scenario, entrypoint): registered F016 behaviour scenario",
]
# Per-test hang guard (pytest-timeout) — NOT a `-m` deselection, so the
# directory-scoped integration tier still collects every test (see the note
# above / conformance T018). `signal` (SIGALRM in the worker's main thread)
# raises a normal per-test Timeout with a traceback and leaves the xdist worker
# alive; `thread` would hard-`os._exit()` the worker, which xdist reports as the
# misleading "node down: Not properly terminated" instead of a clean failure.
addopts = "--timeout=300 --timeout-method=signal"

[tool.poe.tasks]
# No external deps needed: Dapr is mocked; Temporal runs embedded in-process via
# temporalio.testing.WorkflowEnvironment.start_local() (SDK embedded_runtime()).
download-components = "echo 'No Dapr components needed for OpenAPI connector'"
start-deps = "echo 'No external deps needed — Temporal runs embedded in pytest'"
stop-deps = "echo 'No external deps to stop'"
# Regenerate atlan.yaml / app.yaml / app/generated/ from the pkl contract.
# Mirrors the Makefile `generate` target. Required by the SDK Certify step
# (build-and-publish-app.yaml runs `uv run poe generate` and hard-fails if the
# task is missing), which gates every marketplace publish.
generate = { shell = "pkl eval --project-dir contract -m . contract/app.pkl && uvx ruff check --fix --select F401 --quiet app/generated/*.py && uvx ruff format app/generated/*.py" }

[tool.ruff.lint]
extend-select = ["G001", "G003", "G004", "T201", "LOG009"]

[tool.ruff.lint.per-file-ignores]
".github/**" = ["T201"]

