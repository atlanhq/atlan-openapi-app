[project]
name = "openapi"
version = "0.2.1"
description = "OpenAPI Spec Loader connector"
requires-python = ">=3.11"
dependencies = [
    "atlan-application-sdk>=3.0.0,<4.0.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "atlan-application-sdk[tests]>=3.0.0,<4.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "httpx>=0.28.1",
    "pre-commit>=4.2.0",
    "coverage[toml]>=7.13.5",
    "scalene>=2.2.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "cloud_integration: requires a running S3-compatible emulator (MinIO)",
    "azure_integration: requires a running Azure blob storage emulator (Azurite)",
]
addopts = "-m 'not cloud_integration and not azure_integration'"
