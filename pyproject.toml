[project]
name = "openapi"
version = "0.6.0"
description = "OpenAPI Spec Loader connector"
requires-python = ">=3.11"
dependencies = [
    "atlan-application-sdk>=3.6.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "atlan-application-sdk[tests]>=3.6.0,<4.0.0",
    "pytest-asyncio>=1.3.0,<2",
    # Bounds a hung integration test (e.g. a wedged embedded-Temporal worker) so
    # it fails fast rather than eating the CI job's full timeout-minutes.
    "pytest-timeout>=2.3.0,<3",
    "respx>=0.22.0,<1",
    "pre-commit>=4.2.0,<5",
    "coverage[toml]>=7.13.5,<8",
    "scalene>=2.2.1,<3",
    "poethepoet>=0.34.0",
    "atlan-application-sdk-conformance<=1.0.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    # pyatlan and pyatlan_v9 both read their version via the deprecated
    # importlib.resources read_text/open_text API — not fixable from our side
    "ignore:read_text is deprecated:DeprecationWarning",
    "ignore:open_text is deprecated:DeprecationWarning",
    # httpx internal deprecation — not triggered by our code, not fixable here
    "ignore:Use 'content=<\\.\\.\\.>' to upload raw bytes:DeprecationWarning",
]
# Integration tests live under tests/integration/ and are run by the SDK's
# directory-scoped integration CI job (`pytest tests/integration/`), so we do
# NOT `addopts`-deselect them — a deselection would empty that job (collected 0
# → pytest exit 5). Emulator-dependent tests self-skip when their service is
# unreachable (see tests/integration/test_{s3,azure}_download.py), so a bare
# local `pytest` stays green without MinIO/Azurite. The `integration` marker is
# the fleet standard (matches atlan-mysql-app/atlan-metabase-app) and lets a dev
# opt out locally with `-m "not integration"`.
markers = [
    "integration: requires external services (MinIO/Azurite emulators); deselect locally with '-m \"not integration\"'",
    "e2e: tenant-hitting end-to-end test (requires ATLAN_BASE_URL + ATLAN_API_KEY)",
]
# Per-test hang guard (pytest-timeout) — NOT a `-m` deselection, so the
# directory-scoped integration tier still collects every test (see the note
# above / conformance T018). `thread` method fires reliably for asyncio/xdist
# hangs that never yield back to the event loop.
addopts = "--timeout=300 --timeout-method=thread"

[tool.poe.tasks]
# No external deps needed: Dapr is mocked; Temporal runs embedded in-process via
# temporalio.testing.WorkflowEnvironment.start_local() (SDK embedded_runtime()).
download-components = "echo 'No Dapr components needed for OpenAPI connector'"
start-deps = "echo 'No external deps needed — Temporal runs embedded in pytest'"
stop-deps = "echo 'No external deps to stop'"
# Regenerate atlan.yaml / app.yaml / app/generated/ from the pkl contract.
# Mirrors the Makefile `generate` target. Required by the SDK Certify step
# (build-and-publish-app.yaml runs `uv run poe generate` and hard-fails if the
# task is missing), which gates every marketplace publish.
generate = { shell = "pkl eval --project-dir contract -m . contract/app.pkl && uvx ruff check --fix --select F401 --quiet app/generated/*.py && uvx ruff format app/generated/*.py" }

[tool.ruff.lint]
extend-select = ["G001", "G003", "G004", "T201", "LOG009"]

[tool.ruff.lint.per-file-ignores]
".github/**" = ["T201"]

