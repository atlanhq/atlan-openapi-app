services:
  atlan-app:
    working_dir: /app
    extra_hosts:
      # Inject IPv4-only entry so hickory-dns (Temporal Rust SDK) uses IPv4.
      # GitHub Actions runners have no IPv6 routes; AAAA records cause
      # NetworkUnreachable. TEMPORAL_EXTRA_HOST is set by the workflow step
      # "Pin Temporal hostname to IPv4" as "hostname:ipv4".
      - "${TEMPORAL_EXTRA_HOST}"
    volumes:
      # Absolute path required — relative paths in override files resolve to the
      # first compose file's directory (ci-deploy/), not the repo root.
      - ${GITHUB_WORKSPACE}/.github/e2e/secrets:/app/secrets:ro
    environment:
      ATLAN_ENABLE_OBSERVABILITY_DAPR_SINK: "false"
      ATLAN_TEMPORAL_TLS_ENABLED: "true"
      # The configurator derives a fabricated hostname that doesn't exist; override
      # with the actual tenant domain where Temporal gRPC is served on port 443.
      ATLAN_TEMPORAL_HOST: "${CI_TENANT_DOMAIN}:443"
      ATLAN_AUTH_TOKEN_URL: "https://${CI_TENANT_DOMAIN}/auth/realms/default/protocol/openid-connect/token"
      ATLAN_AUTH_BASE_URL: "https://${CI_TENANT_DOMAIN}"
      ATLAN_APP_MODULE: "app.connector:OpenAPIConnector"
