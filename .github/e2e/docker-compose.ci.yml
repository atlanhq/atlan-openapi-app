services:
  atlan-app:
    working_dir: /app
    volumes:
      # Absolute path required — relative paths in override files resolve to the
      # first compose file's directory (ci-deploy/), not the repo root.
      - ${GITHUB_WORKSPACE}/.github/e2e/secrets:/app/secrets:ro
      # Override gai.conf to prefer IPv4: GitHub Actions runners have IPv6
      # interfaces but no global IPv6 routes, causing Temporal gRPC connection
      # failures when DNS returns AAAA records first.
      - ${GITHUB_WORKSPACE}/.github/e2e/gai.conf:/etc/gai.conf:ro
    environment:
      ATLAN_ENABLE_OBSERVABILITY_DAPR_SINK: "false"
      # Bridge env-var naming gaps between atlan-configurator output and app startup
      ATLAN_TEMPORAL_TLS_ENABLED: "${ATLAN_TEMPORAL_TLS_ENABLED:-true}"
      ATLAN_AUTH_TOKEN_URL: "https://${CI_TENANT_DOMAIN}/auth/realms/default/protocol/openid-connect/token"
      ATLAN_AUTH_BASE_URL: "https://${CI_TENANT_DOMAIN}"
      ATLAN_APP_MODULE: "app.connector:OpenAPIConnector"
