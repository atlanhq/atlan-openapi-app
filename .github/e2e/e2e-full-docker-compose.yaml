# App-level docker compose overrides for the OpenAPI connector e2e full-DAG tests.
# Merged on top of the SDK's base CI layer by the composite action.
#
# ATLAN_DEPLOYMENT_NAME drives the Temporal queue via SDK _derive_task_queue:
#   worker queue = atlan-openapi-{ATLAN_DEPLOYMENT_NAME}
# The sdr-e2e composite action derives a per-leg ATLAN_DEPLOYMENT_NAME
# (e2e-full-ci-<run_id>[-<matrix-leg>]) and exports it to the environment before
# `docker compose up`, so each matrix leg's worker gets its OWN queue and the two
# suites never co-serve one queue (which, under two-store per-container
# localstorage, would hide artifacts cross-worker). The e2e harness derives its
# extract-node queue from the same env (BaseE2ETest.agent_spec), so worker and
# harness stay in lock-step with no hard-coded agent name. The `:-` default only
# applies to local `docker compose` runs where the action hasn't set it.

services:
  atlan-app:
    environment:
      ATLAN_APP_MODULE: "app.connector:OpenAPIConnector"
      ATLAN_DEPLOYMENT_NAME: "${ATLAN_DEPLOYMENT_NAME:-e2e-full-ci-local}"
