# Force IPv4 preference in CI.
# GitHub Actions runners have IPv6 interfaces but no global IPv6 routes,
# so the Temporal Rust gRPC client fails with NetworkUnreachable when it
# picks an AAAA record first. Setting ::ffff:0:0/96 precedence to 100
# (above native IPv6's default 40) causes getaddrinfo() to sort IPv4
# addresses before IPv6, making the Rust/tokio resolver try IPv4 first.
precedence ::ffff:0:0/96  100
