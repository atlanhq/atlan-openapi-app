name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Resolve next version from labels on merged PRs since last release.
# feat → minor bump; everything else → patch bump.
version-resolver:
  minor:
    labels: ['feat']
  patch:
    labels: ['fix', 'perf', 'refactor', 'docs', 'chore', 'ci', 'test']
  default: patch

# Auto-apply labels to PRs based on conventional commit prefix in the title.
# Format matched: type(optional-scope)!?: description
# No manual labelling required.
autolabeler:
  - label: 'feat'
    title:
      - '/^feat(\(.+\))?!?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?!?:/i'
  - label: 'perf'
    title:
      - '/^perf(\(.+\))?!?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\(.+\))?!?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.+\))?!?:/i'
  - label: 'test'
    title:
      - '/^test(\(.+\))?!?:/i'
  - label: 'chore'
    title:
      - '/^chore(\(.+\))?!?:/i'
  - label: 'ci'
    title:
      - '/^ci(\(.+\))?!?:/i'
      - '/^build(\(.+\))?!?:/i'

# Release note sections — one per conventional commit category.
categories:
  - title: '🚀 Features'
    labels: ['feat']
  - title: '🐛 Bug Fixes'
    labels: ['fix']
  - title: '⚡ Performance'
    labels: ['perf']
  - title: '♻️ Refactoring'
    labels: ['refactor']
  - title: '📚 Documentation'
    labels: ['docs']
  - title: '🔧 Maintenance'
    labels: ['chore', 'ci', 'test']

# PRs with this label are omitted from the release notes entirely.
exclude:
  labels:
    - 'skip-changelog'
  authors:
    - 'dependabot[bot]'
    - 'renovate[bot]'
    - 'github-actions[bot]'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

template: |
  $CHANGES
