name: Docs link check

# Test workflow for FND-5325 (not bootstrap-managed). Do not merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List Markdown files
        run: find . -name "*.md" -not -path "./.git/*" -print
