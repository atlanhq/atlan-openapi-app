name: SDR Integration Tests

# Triggered by the `sdr-e2e-test` PR label or manual workflow_dispatch.
# Delegates entirely to the SDK composite action, which handles: GHCR login,
# image build, configurator, Dapr stack, IPv4 hostname pin, pytest run,
# GitHub Step Summary, PR comment, commit status, and teardown.
#
# The workflow runs on every PR so the job can post a "skipped" status on
# PRs without the label — branch protection can then list this job as a
# required check without blocking non-labeled PRs (skipped == success).
# The release-gate.yaml workflow blocks release PRs until this label is added.
#
# Branch-protection target: "SDR Integration Tests / SDR E2E Tests"
# (the SDK composite action also posts a separate commit-status context
# `sdr-e2e-tests`, but that is informational — not the required-check target)

on:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
    branches: [main]
  workflow_dispatch:

jobs:
  sdr-tests:
    name: SDR E2E Tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'sdr-e2e-test') ||
      contains(github.event.pull_request.labels.*.name, 'sdr-e2e-test')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: sdr-integration-tests-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: atlanhq/application-sdk/.github/actions/sdr-e2e@main
        with:
          app-name: openapi
          app-image-name: atlan-openapi-app
          secrets-script: .github/e2e/make-secrets.py
        env:
          CI_TENANT_DOMAIN: ${{ secrets.SDR_TEST_TENANT }}
          CI_CLIENT_ID: ${{ secrets.SDR_CLIENT_ID }}
          CI_CLIENT_SECRET: ${{ secrets.SDR_CLIENT_SECRET }}
