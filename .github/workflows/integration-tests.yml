name: Integration Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      distinct_id:

jobs:
  integration-tests:
    name: Integration tests (Temporal)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    timeout-minutes: 30
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: echo distinct ID ${{ github.event.inputs.distinct_id }}
        run: echo ${{ github.event.inputs.distinct_id }}

      - uses: actions/checkout@v4

      - name: Install Temporal CLI and start dev server
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          "$HOME/.temporalio/bin/temporal" server start-dev \
            --db-filename /tmp/temporal.db --headless &
          sleep 5

      - uses: atlanhq/application-sdk/.github/actions/setup-deps@main

      - name: Update application-sdk rev
        if: ${{ github.event.inputs.distinct_id != '' }}
        run: |
          commit_hash=${{ github.event.inputs.distinct_id }}
          uv add git+https://github.com/atlanhq/application-sdk --rev $commit_hash

      - name: Run integration tests with Scalene profiling
        id: integration_tests
        env:
          ATLAN_LOCAL_DEVELOPMENT: true
          ATLAN_APPLICATION_NAME: ${{ github.event.repository.name }}
          TEMPORAL_HOST: localhost:7233
        run: |
          PYTEST_BIN=$(uv run python -c "import shutil; print(shutil.which('pytest'))")
          uv run scalene run -o .github/scalene-profile.json \
            --profile-only app \
            "$PYTEST_BIN" --- \
            tests/integration/ --capture=no --log-cli-level=INFO -v --full-trace

      - name: Upload Scalene profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalene-profile
          path: .github/scalene-profile.json

      - name: Report profiling metrics
        if: always()
        run: |
          if [ -f .github/scalene-profile.json ]; then
            uv run python -c "
          import json
          data = json.load(open('.github/scalene-profile.json'))
          elapsed = data.get('elapsed_time_sec', 0)
          peak_mb = data.get('max_footprint_mb', 0)
          top = sorted(
            [(fname, f['percent_cpu_time']) for fname, f in data.get('files', {}).items()],
            key=lambda x: -x[1]
          )[:5]
          print(f'ELAPSED={elapsed:.2f}')
          print(f'PEAK_MB={peak_mb:.1f}')
          for fname, pct in top:
              short = fname.split('/')[-1]
              print(f'TOP|{short}|{pct:.1f}')
          " > .github/scalene-parsed.txt
            ELAPSED=$(grep ^ELAPSED .github/scalene-parsed.txt | cut -d= -f2)
            PEAK_MB=$(grep ^PEAK_MB .github/scalene-parsed.txt | cut -d= -f2)
          else
            ELAPSED="N/A"
            PEAK_MB="N/A"
          fi

          TEST_RESULT="${{ steps.integration_tests.outcome }}"
          if [ "$TEST_RESULT" = "success" ]; then
            TEST_BADGE="✅ passed"
          else
            TEST_BADGE="❌ failed"
          fi

          echo "## Integration Test Results and Performance Metrics" >> metrics.md
          echo "**Tests:** $TEST_BADGE | **Commit:** \`${{ github.sha }}\`" >> metrics.md
          echo "### Runner Environment Details" >> metrics.md
          echo "$(mpstat 1 1 | awk 'NR == 1')" >> metrics.md
          echo "Total Memory: $(free -m | awk 'NR == 2 {print $2}') MB" >> metrics.md

          echo "### Resource Usage" >> metrics.md
          echo "| Metric | Value |" >> metrics.md
          echo "|--------|-------|" >> metrics.md
          echo "| Elapsed Time | ${ELAPSED}s |" >> metrics.md
          echo "| Peak Memory (RSS) | ${PEAK_MB} MB |" >> metrics.md

          if [ -f .github/scalene-parsed.txt ] && grep -q "^TOP" .github/scalene-parsed.txt; then
            echo "" >> metrics.md
            echo "### Top Files by CPU Time (app/ only)" >> metrics.md
            echo "| File | CPU % |" >> metrics.md
            echo "|------|-------|" >> metrics.md
            grep "^TOP" .github/scalene-parsed.txt | while IFS='|' read -r _ file pct; do
              echo "| \`${file}\` | ${pct}% |" >> metrics.md
            done
          fi

          echo "" >> metrics.md
          echo "_Full profile available as a [workflow artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})._" >> metrics.md

          echo "---" >> metrics.md

          cat metrics.md
          exit 0

      - name: Comment profiling metrics on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message-id: "integration_test_profiling"
          message-path: metrics.md
        continue-on-error: true

      - name: Stop Temporal
        if: always()
        run: pkill -f "temporal server" || true
