name: Integration Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  integration-tests:
    name: Integration tests (Temporal)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Install Temporal CLI and start dev server
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --headless &
          for i in $(seq 1 30); do
            temporal workflow list --namespace default 2>/dev/null && break
            sleep 1
          done

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v
