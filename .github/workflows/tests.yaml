name: Tests

# Unified workflow — unit + integration (Temporal) share a single pytest invocation
# via connector-integration-tests. Cloud (S3/MinIO) and Azure storage tests run as
# separate jobs since they need emulator services. SDR runs on label.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - reopened
    branches:
      - main
  workflow_dispatch:
    inputs:
      distinct_id:
        description: "40-char application-sdk commit SHA to test against (leave empty for lockfile version)"
        required: false

jobs:
  unit-integration:
    name: unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: tests-unit-integration-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    permissions:
      pull-requests: write
      contents: read
    outputs:
      summary: ${{ steps.tests.outputs.summary }}
    steps:
      - name: echo distinct ID ${{ github.event.inputs.distinct_id }}
        run: echo ${{ github.event.inputs.distinct_id }}

      # Explicit checkout so the SDK override (below) can modify uv.lock on
      # disk before connector-integration-tests runs its uv sync.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: atlanhq/application-sdk/.github/actions/setup-deps@main

      - name: Update application-sdk rev
        if: ${{ github.event.inputs.distinct_id != '' }}
        run: |
          commit_hash=${{ github.event.inputs.distinct_id }}
          if ! [[ "$commit_hash" =~ ^[a-f0-9]{40}$ ]]; then
            echo "distinct_id must be a 40-char hex SHA"; exit 1
          fi
          uv add git+https://github.com/atlanhq/application-sdk --rev $commit_hash

      - name: Run all tests in one pytest invocation
        id: tests
        uses: atlanhq/application-sdk/.github/actions/connector-integration-tests@main
        with:
          app-name: openapi
          pytest-args: >-
            -n auto --dist=loadfile --tb=short
            --cov=app --cov-report=xml --cov-report=html --cov-report=term
            --cov-fail-under=0

  integration-s3:
    name: Integration Tests (S3/MinIO)
    runs-on: ubuntu-latest
    concurrency:
      group: tests-integration-s3-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: echo distinct ID ${{ github.event.inputs.distinct_id }}
        run: echo ${{ github.event.inputs.distinct_id }}

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@6d04211d9dfbd5cb2493a4a6637b2ad784a60ccc

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --db-filename /tmp/temporal.db --headless &
          until temporal operator namespace describe default >/dev/null 2>&1; do sleep 1; done

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          echo "Waiting for MinIO to be ready..."
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done
          echo "MinIO is ready."
          AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin \
            aws --endpoint-url http://localhost:9000 \
            s3api create-bucket --bucket test-openapi-specs --region us-east-1

      - uses: atlanhq/application-sdk/.github/actions/setup-deps@main

      - name: Update application-sdk rev
        if: ${{ github.event.inputs.distinct_id != '' }}
        run: |
          commit_hash=${{ github.event.inputs.distinct_id }}
          if ! [[ "$commit_hash" =~ ^[a-f0-9]{40}$ ]]; then
            echo "distinct_id must be a 40-char hex SHA"; exit 1
          fi
          uv add git+https://github.com/atlanhq/application-sdk --rev $commit_hash

      - name: Run cloud integration tests
        env:
          ATLAN_LOCAL_DEVELOPMENT: "true"
          ATLAN_APPLICATION_NAME: ${{ github.event.repository.name }}
          TEMPORAL_HOST: localhost:7233
          AWS_ENDPOINT_URL: http://localhost:9000
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        run: |
          uv run pytest tests/integration/test_s3_download.py \
            -v -m cloud_integration --capture=no --log-cli-level=INFO

      - name: Stop services
        if: always()
        run: |
          docker stop minio || true
          pkill -f "temporal server" || true

  integration-azure:
    name: Integration Tests (Azure/Azurite)
    runs-on: ubuntu-latest
    concurrency:
      group: tests-integration-azure-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: echo distinct ID ${{ github.event.inputs.distinct_id }}
        run: echo ${{ github.event.inputs.distinct_id }}

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@6d04211d9dfbd5cb2493a4a6637b2ad784a60ccc

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --db-filename /tmp/temporal.db --headless &
          until temporal operator namespace describe default >/dev/null 2>&1; do sleep 1; done

      - name: Start Azurite
        run: |
          docker run -d --name azurite \
            -p 10000:10000 \
            "mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:dae2a5f96553962901304b94e72ef87e299d0825e4b679673bcc527a25076fe4" \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          echo "Waiting for Azurite to be ready..."
          until curl -s --max-time 2 http://127.0.0.1:10000/devstoreaccount1 > /dev/null 2>&1; do sleep 1; done
          echo "Azurite is ready."
          az storage container create \
            --name test-openapi-specs \
            --connection-string "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"

      - uses: atlanhq/application-sdk/.github/actions/setup-deps@main

      - name: Update application-sdk rev
        if: ${{ github.event.inputs.distinct_id != '' }}
        run: |
          commit_hash=${{ github.event.inputs.distinct_id }}
          if ! [[ "$commit_hash" =~ ^[a-f0-9]{40}$ ]]; then
            echo "distinct_id must be a 40-char hex SHA"; exit 1
          fi
          uv add git+https://github.com/atlanhq/application-sdk --rev $commit_hash

      - name: Run Azure integration tests
        env:
          ATLAN_LOCAL_DEVELOPMENT: "true"
          ATLAN_APPLICATION_NAME: ${{ github.event.repository.name }}
          TEMPORAL_HOST: localhost:7233
          AZURE_STORAGE_ENDPOINT: http://127.0.0.1:10000
        run: |
          uv run pytest tests/integration/test_azure_download.py \
            -v -m azure_integration --capture=no --log-cli-level=INFO

      - name: Stop services
        if: always()
        run: |
          docker stop azurite || true
          pkill -f "temporal server" || true

  sdr:
    name: sdr
    # Runs only when labeled sdr-e2e-test or via workflow_dispatch.
    # Skipped PRs count as success so this job can be a required check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'sdr-e2e-test') ||
      contains(github.event.pull_request.labels.*.name, 'sdr-e2e-test')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: tests-sdr-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    permissions:
      pull-requests: write
      contents: read
      statuses: write
      packages: write
    outputs:
      summary: ${{ steps.sdr.outputs.test-summary }}
    env:
      CI_TENANT_DOMAIN: ${{ secrets.SDR_TEST_TENANT }}
      CI_CLIENT_ID: ${{ secrets.SDR_CLIENT_ID }}
      CI_CLIENT_SECRET: ${{ secrets.SDR_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run connector SDR tests
        id: sdr
        uses: atlanhq/application-sdk/.github/actions/sdr-e2e@main
        with:
          app-name: openapi
          app-image-name: atlan-openapi-app
          secrets-script: .github/sdr-e2e/make-secrets.py

  tests-passed:
    name: tests-passed
    needs: [unit-integration, integration-s3, integration-azure, sdr]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Post unified test-summary comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@8e4927817251f1ff60c001f04568532b38e0b4a0 # v3.11.0
        with:
          message-id: tests-summary
          message: |
            ## Tests Summary

            | Job | Status | Result |
            |---|---|---|
            | unit + integration | ${{ needs.unit-integration.result == 'success' && '✅ Passed' || (needs.unit-integration.result == 'skipped' && '⊘ Skipped' || '❌ Failed') }} | `${{ needs.unit-integration.outputs.summary || 'no summary' }}` |
            | integration-s3 | ${{ needs.integration-s3.result == 'success' && '✅ Passed' || (needs.integration-s3.result == 'skipped' && '⊘ Skipped' || '❌ Failed') }} | |
            | integration-azure | ${{ needs.integration-azure.result == 'success' && '✅ Passed' || (needs.integration-azure.result == 'skipped' && '⊘ Skipped' || '❌ Failed') }} | |
            | sdr | ${{ needs.sdr.result == 'success' && '✅ Passed' || (needs.sdr.result == 'skipped' && '⊘ Skipped' || '❌ Failed') }} | `${{ needs.sdr.outputs.summary || 'no summary' }}` |

            **Overall:** ${{ (needs.unit-integration.result == 'success' && needs.integration-s3.result == 'success' && needs.integration-azure.result == 'success' && (needs.sdr.result == 'success' || needs.sdr.result == 'skipped')) && '✅ All passed' || '❌ Some failed' }} — [view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true

      - name: Verify all test jobs succeeded
        run: |
          if [ "${{ needs.unit-integration.result }}" != "success" ]; then
            echo "::error::unit + integration did not succeed (result=${{ needs.unit-integration.result }})"
            exit 1
          fi
          if [ "${{ needs.integration-s3.result }}" != "success" ]; then
            echo "::error::integration-s3 did not succeed (result=${{ needs.integration-s3.result }})"
            exit 1
          fi
          if [ "${{ needs.integration-azure.result }}" != "success" ]; then
            echo "::error::integration-azure did not succeed (result=${{ needs.integration-azure.result }})"
            exit 1
          fi
          if [ "${{ needs.sdr.result }}" != "success" ] && [ "${{ needs.sdr.result }}" != "skipped" ]; then
            echo "::error::sdr did not succeed (result=${{ needs.sdr.result }})"
            exit 1
          fi
          echo "All test jobs passed."
