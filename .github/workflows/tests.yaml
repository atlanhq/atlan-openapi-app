name: Tests

# This file is scaffolded by `atlan-application-sdk-conformance bootstrap`
# and drift-tracked at WARN by conformance check C002.
#
# Edit it freely — drift NEVER blocks CI (C002 is WARN-only, not BLOCK).
# To force-regenerate this file from canonical, delete it and re-run bootstrap:
#   atlan-application-sdk-conformance bootstrap --app-name openapi

# INTENTIONAL DIVERGENCE: services-script
# Most connectors start source containers inside session-scoped pytest fixtures
# (see mysql/metabase conftest.py). openapi passes services-script here to
# exercise the CI-level service-hook end-to-end — a deliberate reference
# demonstration kept to prove the pattern before other connectors need it
# (review c_075b69). The hook brings up MinIO and Azurite before tests run.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    branches:
      - main
  merge_group:
  workflow_dispatch:
    inputs:
      application_sdk_ref:
        description: |
          Branch/SHA of atlanhq/application-sdk for cross-repo dispatch.
          Pins SDK in tests + e2e jobs. Empty = lockfile version.
        required: false
        default: ""
        type: string
      distinct_id:
        description: |
          Identifier for codex-/return-dispatch matching. Echoed in step
          names so the calling workflow can locate this run via the GH API.
        required: false
        default: ""
        type: string
      agent_name_override:
        description: |
          Override agent-name for the e2e job (default ci-<run_id>).
          Useful when re-running against a worker that is already up.
        required: false
        default: ""
        type: string
      run_e2e:
        description: "Set to 'true' to trigger the e2e job (cross-repo dispatch from application-sdk). Defaults to off."
        required: false
        default: ""
        type: string
      base_image_ref:
        description: |
          Runtime base image for the connector Docker build (BASE_IMAGE
          build-arg), set by the application-sdk PR dispatch so SDK
          base-image / Dockerfile / daprd changes are exercised. Empty =
          the connector Dockerfile default base.
        required: false
        default: ""
        type: string

jobs:
  tests:
    uses: atlanhq/application-sdk/.github/workflows/tests-reusable.yaml@main
    with:
      app-name: "openapi"
      app-image-name: "atlan-openapi-app"
      enable-e2e: true
      # openapi uses CI-level MinIO/Azurite setup via the services-script hook
      # (see .github/test/setup-services.sh). Most connectors should prefer
      # session-scoped pytest fixtures instead.
      services-script: .github/test/setup-services.sh
      # --override-ini=addopts= clears the pyproject.toml marker filter so
      # cloud_integration and azure_integration tests are included here.
      pytest-args: >-
        -n auto --dist=loadfile --tb=short
        --cov=app --cov-report=xml --cov-report=html --cov-report=term
        --cov-fail-under=0
        --override-ini=addopts=
      e2e-test-path: tests/e2e/
      application-sdk-ref: ${{ inputs.application_sdk_ref }}
      distinct-id: ${{ inputs.distinct_id }}
      run-e2e: ${{ inputs.run_e2e }}
      base-image-ref: ${{ inputs.base_image_ref }}
      agent-name-override: ${{ inputs.agent_name_override }}
    secrets: inherit

  # Aggregator gate — the single required status check for branch protection.
  # Shows as "Tests / Tests Gate" (2-deep) rather than nested inside the reusable.
  tests-gate:
    name: Tests Gate
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Post unified test-summary comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@8e4927817251f1ff60c001f04568532b38e0b4a0 # v3.11.0
        with:
          message-id: tests-summary
          message: |
            ## Tests Summary

            | Job | Status | Result |
            |---|---|---|
            | tests | ${{ needs.tests.outputs.tests-result == 'success' && '✅ Passed' || (needs.tests.outputs.tests-result == 'skipped' && '⊘ Skipped' || '❌ Failed') }} | `${{ needs.tests.outputs.tests-summary || 'no summary' }}` |
            | e2e | ${{ needs.tests.outputs.e2e-result == 'success' && '✅ Passed' || (needs.tests.outputs.e2e-result == 'skipped' && '⊘ Skipped — add `e2e` label to trigger' || '❌ Failed') }} | (see run) |

            **Overall:** ${{ (needs.tests.outputs.tests-result == 'success' && (needs.tests.outputs.e2e-result == 'success' || needs.tests.outputs.e2e-result == 'skipped')) && '✅ All passed' || '❌ Some failed' }} — [view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        continue-on-error: true

      - name: Verify all test jobs succeeded
        run: |
          if [ "${{ needs.tests.outputs.tests-result }}" != "success" ]; then
            echo "::error::Unit and integration tests did not succeed (result=${{ needs.tests.outputs.tests-result }})"
            exit 1
          fi
          if [ "${{ needs.tests.outputs.e2e-result }}" != "success" ] && [ "${{ needs.tests.outputs.e2e-result }}" != "skipped" ]; then
            echo "::error::End-to-end tests did not succeed (result=${{ needs.tests.outputs.e2e-result }})"
            exit 1
          fi
          echo "All test jobs passed."
