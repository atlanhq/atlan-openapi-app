name: Cloud Integration Tests (GCS/fake-gcs-server)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      distinct_id:

jobs:
  gcs-integration-tests:
    name: Cloud integration tests (fake-gcs-server + Temporal)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: echo distinct ID ${{ github.event.inputs.distinct_id }}
        run: echo ${{ github.event.inputs.distinct_id }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Temporal CLI
        uses: temporalio/setup-temporal@6d04211d9dfbd5cb2493a4a6637b2ad784a60ccc

      - name: Start Temporal dev server
        run: |
          temporal server start-dev --db-filename /tmp/temporal.db --headless &
          sleep 5

      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs-server \
            -p 4443:4443 \
            fsouza/fake-gcs-server:1.54.0@sha256:28caaea87a75a7edce77dd8a5a58ef05c625c7974fb7a916a4f9ebd7d494166b \
            -scheme http -port 4443
          echo "Waiting for fake-gcs-server to be ready..."
          until curl -sf http://localhost:4443/storage/v1/b > /dev/null; do sleep 1; done
          echo "fake-gcs-server is ready."
          curl -s -X POST http://localhost:4443/storage/v1/b \
            -H "Content-Type: application/json" \
            -d '{"name": "test-openapi-specs"}'

      - uses: atlanhq/application-sdk/.github/actions/setup-deps@main

      - name: Update application-sdk rev
        if: ${{ github.event.inputs.distinct_id != '' }}
        run: |
          commit_hash=${{ github.event.inputs.distinct_id }}
          uv add git+https://github.com/atlanhq/application-sdk --rev $commit_hash

      - name: Run GCS integration tests
        env:
          ATLAN_LOCAL_DEVELOPMENT: "true"
          ATLAN_APPLICATION_NAME: ${{ github.event.repository.name }}
          TEMPORAL_HOST: localhost:7233
          GCS_ENDPOINT_URL: http://localhost:4443
        run: |
          uv run pytest tests/integration/test_gcs_download.py \
            -v -m gcs_integration --capture=no --log-cli-level=INFO

      - name: Stop services
        if: always()
        run: |
          docker stop fake-gcs-server || true
          pkill -f "temporal server" || true
