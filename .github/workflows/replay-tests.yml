name: Replay Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  replay-tests:
    name: Replay tests (Temporal)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Start Temporal dev server
        run: |
          temporal server start-dev \
            --dynamic-config-value frontend.WorkerHeartbeatsEnabled=true \
            --headless &
          for i in $(seq 1 30); do
            temporal workflow list --namespace default 2>/dev/null && break
            sleep 1
          done

      - name: Run replay tests
        run: uv run pytest tests/replay/ -v
