# gitleaks configuration for atlan-openapi-app.
#
# The credential-leak gate in application-sdk's build-and-publish workflow runs
# gitleaks as a BLOCKING step: a finding trips prepare's `!failure()` and skips
# build, push, deploy and publish. The gate pins gitleaks 8.21.2 and reads this
# file from the repo root (it checks out the repo to `app/` and runs there).
#
# IMPORTANT: use the singular `[allowlist]` table, not `[[allowlists]]`.
# The array form is only understood by later gitleaks releases; 8.21.2 ignores
# it silently, so entries written that way have no effect in CI even though
# they work with a modern local binary.
#
# Every finding this app produces is a false positive on a test fixture. The
# entries below are scoped by line regex rather than by path, so a real secret
# added to any of these files is still caught.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures: local-emulator connection string and placeholder GUIDs"
regexTarget = "line"
regexes = [
  # Azure Storage Emulator (Azurite) development connection string — a fixed,
  # publicly documented constant, identical in every Azurite install, whose
  # endpoint is 127.0.0.1. Grants access to nothing. Used to create the local
  # blob container the Azure download tests read from:
  #   .github/test/setup-services.sh, Makefile,
  #   tests/integration/test_azure_download.py
  # Matched via the well-known account name so the entry cannot cover an
  # unrelated high-entropy value on another line.
  '''AccountName=devstoreaccount1''',

  # Placeholder credential GUIDs in unit tests, e.g.
  #   assert resolved_ref.credential_guid == "legacy-guid-123"
  # Scoped to the placeholder shape, not the file, so a real GUID committed to
  # the same test would still be flagged.
  '''legacy-guid-\d+''',
]
